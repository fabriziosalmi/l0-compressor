[package]
name = "l0-compressor"
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
description = "Lightweight CLI proxy that reduces LLM token consumption via universal output filtering"
license = "MIT"
repository = "https://github.com/fabriziosalmi/l0-compressor"
homepage = "https://github.com/fabriziosalmi/l0-compressor"
keywords = ["cli", "proxy", "llm", "token", "filter"]
categories = ["command-line-utilities"]

[[bin]]
name = "l0-compressor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Used only by `examples/token_benchmark.rs` (tokenizer-measured savings).
# Not compiled into the release binary; the MSRV job runs `cargo check`,
# which does not build dev-dependencies.
tiktoken-rs = "0.9"

[profile.release]
opt-level = "z"     # optimize for size
lto = true
codegen-units = 1
strip = true
